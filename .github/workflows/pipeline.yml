name: pipeline

# Every branch push runs lint and the tests. A push to main then builds the
# image and publishes :latest and :sha-<commit>. A v* tag waits for that
# commit's main run to succeed, promotes the same image digests to the release
# tag without rebuilding, cuts the GitHub release, and publishes the skill to
# ClawHub.
on: [push]

permissions: {}

jobs:
  # make lint and make test build their Docker test stage and run against the
  # pseudo-terminal printer fixture; no real printer is touched. A tag reuses
  # the main run of the same commit instead of testing it again.
  code:
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: read
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/code-workflow.yml@master
    with:
      lint_command: "make lint"
      test_command: "make test"

  # Only a push to the default branch builds the image; other branches stop
  # after the code job. It also tags the image sha-<commit>, so a release tag
  # on that commit can promote it instead of rebuilding.
  docker:
    needs: [code]
    if: "!startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch"
    permissions:
      contents: write # GitHub Release
      security-events: write # upload the Grype SARIF to the Security tab
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master
    with:
      repository_name: psyb0t/marlinfw-tools
      target_platforms: "linux/amd64,linux/arm64"
      # The Dockerfile ends on the test stage; publish only the runtime image.
      build_targets: '[{"target":"runtime"}]'
      push_sha_tag: true
      # Report scan findings to the Security tab but don't fail the run.
      scan_fail_build: false
      dockerhub_private: false
      sync_description: true
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  # A release tag waits for the main run of its commit, which already tested
  # and built it, then promotes that image by digest.
  wait:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/wait-for-default-branch.yml@master

  docker-promote:
    needs: [wait]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      # The called workflow's release job asks for write even when
      # create_release turns it off, and GitHub checks that up front.
      contents: write
      security-events: write # upload the Grype SARIF to the Security tab
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master
    with:
      repository_name: psyb0t/marlinfw-tools
      target_platforms: "linux/amd64,linux/arm64"
      build_targets: '[{"target":"runtime"}]'
      promote_on_tag: true
      # The release job below cuts the release from the tag's own notes.
      create_release: false
      # The main run already scanned this digest and set the description.
      scan_enabled: false
      sync_description: false
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  release:
    needs: [docker-promote]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/release-workflow.yml@master

  badges:
    needs: [code, release]
    if: "always() && ((github.ref_name == github.event.repository.default_branch && needs.code.result == 'success') || (startsWith(github.ref, 'refs/tags/') && needs.release.result == 'success'))"
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master

  # Publish the skill to ClawHub on tag pushes only, after the release and the
  # image it runs exist.
  publish-to-clawhub:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master
    with:
      skill_names: '["marlinfw-tools"]'
      plugin_names: "[]"
      # The skill and its wrapper script name psyb0t/marlinfw-tools:latest; the
      # published copy gets the release image instead.
      pin_images: '["psyb0t/marlinfw-tools"]'
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
